<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Archive — Mini Notes</title>
    <link href="/static/app.css" rel="stylesheet"/>
    <meta content="{{.CSRFToken}}" name="csrf-token"/>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-12">

    <a class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors mb-4 inline-block" href="/note">← All
        notes</a>
    <h1 class="text-3xl font-bold tracking-tight mb-8">🗃 Archive</h1>

    {{if .Notes}}
    <ul class="space-y-3" id="archive-list">
        {{range .Notes}}
        <li class="bg-zinc-900 border border-zinc-800 rounded-xl p-5" id="note-{{.ID}}">
            <div class="flex gap-4 items-start">
                {{if and .ImageData (not .IsEncrypted)}}
                <img alt="" class="w-16 h-16 object-cover rounded-lg shrink-0 opacity-40"
                     src="/uploads/{{.ImageData}}"/>
                {{end}}
                <div class="min-w-0 flex-1">
                    <p class="font-semibold text-lg text-zinc-500">{{.Title}}</p>
                    {{if not .IsEncrypted}}
                    <p class="text-zinc-600 text-sm mt-1 line-clamp-2">{{.Content}}</p>
                    {{end}}
                    <p class="text-zinc-700 text-xs mt-2">Deleted: {{formatDate .DeletedAt}}</p>
                </div>
                <div class="shrink-0 flex flex-col gap-2">
                    <button class="text-sm text-green-500 hover:text-green-400 border border-green-900 hover:border-green-700 px-3 py-1.5 rounded transition-colors whitespace-nowrap"
                            onclick="restoreNote({{.ID}})">
                        Restore
                    </button>
                    <button class="text-sm text-red-500 hover:text-red-400 border border-red-900 hover:border-red-700 px-3 py-1.5 rounded transition-colors whitespace-nowrap"
                            onclick="permanentDelete({{.ID}})">
                        Delete permanently
                    </button>
                </div>
            </div>
        </li>
        {{end}}
    </ul>
    {{else}}
    <p class="text-zinc-500">Archive is empty.</p>
    {{end}}

</div>

<div id="modal-overlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl">
        <p id="modal-message" class="text-zinc-100 text-base mb-6"></p>
        <div class="flex gap-3 justify-end">
            <button id="modal-cancel" class="px-4 py-2 rounded-xl text-sm text-zinc-300 border border-zinc-700 hover:border-zinc-500 transition-colors">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 rounded-xl text-sm font-semibold bg-red-700 hover:bg-red-600 text-white transition-colors">Delete</button>
        </div>
    </div>
</div>

<script>
    const csrfToken = () => document.querySelector('meta[name="csrf-token"]').content

    function showConfirm(message, confirmLabel) {
        return new Promise(resolve => {
            const overlay = document.getElementById('modal-overlay')
            document.getElementById('modal-message').textContent = message
            document.getElementById('modal-confirm').textContent = confirmLabel || 'Delete'
            overlay.classList.remove('hidden')
            const close = val => { overlay.classList.add('hidden'); resolve(val) }
            document.getElementById('modal-confirm').onclick = () => close(true)
            document.getElementById('modal-cancel').onclick = () => close(false)
            const onKey = e => { if (e.key === 'Escape') { close(false); document.removeEventListener('keydown', onKey) } }
            document.addEventListener('keydown', onKey)
        })
    }

    function restoreNote(id) {
        fetch('/note/' + id + '/restore', {
            method: 'POST',
            headers: {'X-CSRF-Token': csrfToken()}
        }).then(r => {
            if (r.ok) {
                const el = document.getElementById('note-' + id)
                if (el) el.remove()
            }
        })
    }

    async function permanentDelete(id) {
        if (!await showConfirm('Delete permanently? This action cannot be undone.', 'Delete permanently')) return
        fetch('/note/' + id + '/permanent', {
            method: 'DELETE',
            headers: {'X-CSRF-Token': csrfToken()}
        }).then(r => {
            if (r.ok) {
                const el = document.getElementById('note-' + id)
                if (el) el.remove()
            }
        })
    }
</script>
</body>
</html>
