<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12">

    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold tracking-tight">📝 Mini Notes</h1>
      <a href="/note/new" class="bg-zinc-100 text-zinc-900 font-semibold px-4 py-2 rounded-xl hover:bg-white transition-colors text-sm">+ Новая</a>
    </div>

    {{if .Notes}}
      <ul class="space-y-3">
        {{range .Notes}}
          <li class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 hover:border-zinc-600 transition-colors">
            <a href="/note/{{.ID}}" class="flex gap-4 items-start">
              {{if .ImageData}}
                <img src="data:image/*;base64,{{.ImageData}}" alt="" class="w-16 h-16 object-cover rounded-lg shrink-0" />
              {{end}}
              <div class="min-w-0">
                <p class="font-semibold text-lg text-zinc-100">{{.Title}}</p>
                <p class="text-zinc-400 text-sm mt-1 line-clamp-2">{{.Content}}</p>
              </div>
            </a>
          </li>
        {{end}}
      </ul>
    {{else}}
      <p class="text-zinc-500">Заметок пока нет.</p>
    {{end}}

  </div>
</body>
</html>
