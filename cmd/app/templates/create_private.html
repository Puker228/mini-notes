<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>New Private Note — Mini Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/static/app.css" rel="stylesheet"/>
    <meta content="{{.CSRFToken}}" name="csrf-token"/>
</head>
<body class="text-zinc-100 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-10 fade-in">

    <a class="text-zinc-400 hover:text-zinc-100 text-sm transition-colors mb-6 inline-flex items-center gap-1.5 group" href="/note">
        <span class="transition-transform group-hover:-translate-x-0.5">←</span> All notes
    </a>

    <div class="flex items-center gap-3 mt-4 mb-8">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-xl"
             style="background: linear-gradient(135deg, oklch(0.55 0.18 280), oklch(0.45 0.20 260)); box-shadow: 0 6px 20px -6px rgba(99,102,241,0.5);">
            🔒
        </div>
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Private Note</h1>
            <p class="text-xs text-zinc-500 mt-0.5">End-to-end encrypted with your password</p>
        </div>
    </div>

    <form action="/note/private" class="glass rounded-2xl p-6 space-y-5" enctype="multipart/form-data" method="POST">
        <input name="_csrf" type="hidden" value="{{.CSRFToken}}"/>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-2" for="title">Title</label>
            <input
                    class="input-field w-full rounded-xl px-4 py-3"
                    id="title"
                    name="title"
                    placeholder="Note title"
                    required
                    type="text"
            />
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-2" for="content">Content</label>
            <textarea
                    class="input-field w-full rounded-xl px-4 py-3 resize-none scrollbar-thin"
                    id="content"
                    name="content"
                    placeholder="Sensitive content…"
                    rows="8"
            ></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-2" for="password">Encryption password</label>
            <input
                    class="input-field w-full rounded-xl px-4 py-3"
                    id="password"
                    name="password"
                    placeholder="Strong password"
                    required
                    type="password"
            />
            <div class="mt-2 flex items-start gap-2 text-xs text-amber-300/80 bg-amber-500/5 border border-amber-500/20 rounded-lg p-2.5">
                <span>⚠</span>
                <p>If lost, this note cannot be decrypted. Store it somewhere safe.</p>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-2" for="image">Image <span class="text-zinc-500 font-normal">(optional)</span></label>
            <input
                    accept="image/*"
                    class="input-field w-full rounded-xl px-4 py-3 text-zinc-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-violet-500/20 file:text-violet-200 hover:file:bg-violet-500/30 cursor-pointer"
                    id="image"
                    name="image"
                    type="file"
            />
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
            <a href="/note" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">Cancel</a>
            <button class="btn-primary px-6 py-2.5 rounded-xl text-sm" type="submit">🔒 Encrypt & save</button>
        </div>
    </form>

</div>
</body>
</html>
