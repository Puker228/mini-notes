<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{if .Note}}{{.Note.Title}}{{else}}Note{{end}} — Mini Notes</title>
    <link href="/static/app.css" rel="stylesheet"/>
    <meta content="{{.CSRFToken}}" name="csrf-token"/>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-12">

    <a class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors mb-8 inline-block" href="/note">← All
        notes</a>

    {{if .Note}}
    <div class="flex items-start justify-between mt-4 mb-4 gap-4">
        <h1 class="text-3xl font-bold tracking-tight">{{.Note.Title}}</h1>
        <div class="shrink-0 flex items-center gap-2">
            <a class="text-sm text-zinc-300 hover:text-white border border-zinc-700 hover:border-zinc-500 px-3 py-1.5 rounded transition-colors"
               href="/note/{{.Note.ID}}/edit">Edit</a>
            <button class="text-sm text-red-500 hover:text-red-400 border border-red-800 hover:border-red-600 px-3 py-1.5 rounded transition-colors"
                    onclick="deleteNote({{.Note.ID}})">
                Delete
            </button>
        </div>
    </div>
    {{if and .Note.ImageData (not .Note.IsEncrypted)}}
    <img alt="" class="rounded-xl mb-6 max-h-96 object-contain" src="/uploads/{{.Note.ImageData}}"/>
    {{end}}
    {{if not .Note.IsEncrypted}}
    <p class="text-zinc-300 leading-relaxed whitespace-pre-wrap">{{.Note.Content}}</p>
    {{end}}
    <div class="flex gap-4 mt-8 text-xs text-zinc-600 border-t border-zinc-800 pt-4">
        <span>Created: {{formatDate .Note.CreatedAt}}</span>
        <span>Modified: {{formatDate .Note.UpdatedAt}}</span>
    </div>
    {{else}}
    <p class="text-zinc-500 mt-4">Note not found.</p>
    {{end}}

</div>

<div id="modal-overlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl">
        <p id="modal-message" class="text-zinc-100 text-base mb-6"></p>
        <div class="flex gap-3 justify-end">
            <button id="modal-cancel" class="px-4 py-2 rounded-xl text-sm text-zinc-300 border border-zinc-700 hover:border-zinc-500 transition-colors">Cancel</button>
            <button id="modal-confirm" class="px-4 py-2 rounded-xl text-sm font-semibold bg-red-700 hover:bg-red-600 text-white transition-colors">Delete</button>
        </div>
    </div>
</div>

<script>
    const csrfToken = () => document.querySelector('meta[name="csrf-token"]').content

    function showConfirm(message, confirmLabel) {
        return new Promise(resolve => {
            const overlay = document.getElementById('modal-overlay')
            document.getElementById('modal-message').textContent = message
            document.getElementById('modal-confirm').textContent = confirmLabel || 'Delete'
            overlay.classList.remove('hidden')
            const close = val => { overlay.classList.add('hidden'); resolve(val) }
            document.getElementById('modal-confirm').onclick = () => close(true)
            document.getElementById('modal-cancel').onclick = () => close(false)
            const onKey = e => { if (e.key === 'Escape') { close(false); document.removeEventListener('keydown', onKey) } }
            document.addEventListener('keydown', onKey)
        })
    }

    async function deleteNote(id) {
        if (!await showConfirm('Move note to archive?', 'Archive')) return
        fetch('/note/' + id, {
            method: 'DELETE',
            headers: {'X-CSRF-Token': csrfToken()}
        }).then(() => window.location.href = '/note')
    }
</script>
</body>
</html>
