<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{if .Note}}{{.Note.Title}}{{else}}Заметка{{end}} — Mini Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12">

    <a href="/note" class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors mb-8 inline-block">← Все заметки</a>

    {{if .Note}}
      <div class="flex items-start justify-between mt-4 mb-4 gap-4">
        <h1 class="text-3xl font-bold tracking-tight">{{.Note.Title}}</h1>
        <div class="shrink-0 flex items-center gap-2">
          <a href="/note/{{.Note.ID}}/edit" class="text-sm text-zinc-300 hover:text-white border border-zinc-700 hover:border-zinc-500 px-3 py-1.5 rounded transition-colors">Редактировать</a>
          <button onclick="deleteNote({{.Note.ID}})" class="text-sm text-red-500 hover:text-red-400 border border-red-800 hover:border-red-600 px-3 py-1.5 rounded transition-colors">Удалить</button>
        </div>
      </div>
      <p class="text-zinc-300 leading-relaxed whitespace-pre-wrap">{{.Note.Content}}</p>
    {{else}}
      <p class="text-zinc-500 mt-4">Заметка не найдена.</p>
    {{end}}

  </div>
  <script>
    function deleteNote(id) {
      if (!confirm('Удалить заметку?')) return
      fetch('/note/' + id, { method: 'DELETE' })
        .then(() => window.location.href = '/note')
    }
  </script>
</body>
</html>
