<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{if .Note}}Редактировать {{.Note.Title}}{{else}}Редактировать заметку{{end}} — Mini Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12">

    <a href="{{if .Note}}/note/{{.Note.ID}}{{else}}/note{{end}}" class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors mb-8 inline-block">← Назад</a>

    {{if .Note}}
      <h1 class="text-3xl font-bold mt-4 mb-8 tracking-tight">Редактировать заметку</h1>

      <form method="POST" action="/note/{{.Note.ID}}/edit" class="space-y-5">
        <div>
          <label class="block text-sm text-zinc-400 mb-1" for="title">Заголовок</label>
          <input
            id="title"
            name="title"
            type="text"
            required
            value="{{.Note.Title}}"
            placeholder="Заголовок заметки"
            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
          />
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-1" for="content">Содержание</label>
          <textarea
            id="content"
            name="content"
            rows="6"
            required
            placeholder="Текст заметки..."
            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors resize-none"
          >{{.Note.Content}}</textarea>
        </div>
        <button
          type="submit"
          class="bg-zinc-100 text-zinc-900 font-semibold px-6 py-2.5 rounded-xl hover:bg-white transition-colors"
        >
          Сохранить
        </button>
      </form>
    {{else}}
      <p class="text-zinc-500 mt-4">Заметка не найдена.</p>
    {{end}}

  </div>
</body>
</html>
