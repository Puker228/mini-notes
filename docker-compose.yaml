services:
  mini-notes:
    build:
      context: .
    image: mini-notes:latest
    container_name: mini-notes
    restart: always
    ports:
      - "8800:8800"
    environment:
      NOTES_DB_PATH: /data/db/notes.db
      NOTES_UPLOADS_PATH: /data/uploads
      NOTES_LOG_PATH: /data/logs/mini-notes.log
      NOTES_BACKUP_PATH: /data/backups
    volumes:
      - mini-notes-data:/data

volumes:
  mini-notes-data:
