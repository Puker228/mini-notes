version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/notes/db/schema.sql"
    queries: "internal/notes/db/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/notes/db"
        sql_package: "database/sql"
        emit_empty_slices: true
        query_parameter_limit: 0
        emit_pointers_for_null_types: true